- q: Why is the colour bleeding when I wash my block print?
  doc: fabric-care.md
  excerpts: ["colour can bleed in the first few washes. Wash the first time separately in cold water with a mild detergent."]
- q: Is an uneven print a defect?
  doc: fabric-care.md
  excerpts: ["Small irregularities in the print, uneven edges or a slightly different shade between two pieces are part of hand printing and are not defects."]
- q: Does mul cotton shrink?
  doc: fabric-care.md
  excerpts: ["Mul shrinks a little, about two percent, in the first wash"]
- q: How do I store a chanderi dupatta with zari work?
  doc: fabric-care.md
  excerpts: ["store it folded in a muslin cloth rather than on a hanger, and keep it away from perfume, which tarnishes metallic thread."]
- q: Why does my ajrakh smell?
  doc: fabric-care.md
  excerpts: ["ajrakh is a resist and mordant print from Kutch with a distinctive smell for the first few washes that fades with time."]
- q: Can I iron over mirror work?
  doc: fabric-care.md
  excerpts: ["Never iron directly on embroidery, mirror work or printed areas with puff paint; place a cotton cloth over them."]
