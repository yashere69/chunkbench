[project]
name = "chunkbench"
version = "0.3.0"
description = "Score RAG chunking strategies by the exact text that answers each question: span recall, precision and IoU, at equal budgets, with BM25 or embeddings."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yash Sharma" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
wordllama = ["wordllama==0.4.0.post1"]

[project.scripts]
chunkbench = "chunkbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["wordllama", "wordllama.*"]
ignore_missing_imports = true
